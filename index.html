<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WINLINE LIGHT 🔥</title>
    <style>
        :root {
            --win-orange: #FF6A13;
            --win-orange-bright: #FF8A33;
            --win-black: #141419;
            --win-white: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            background-color: var(--win-black);
            font-family: 'Arial Black', 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--win-white);
            transition: background-color 0.15s;
        }

        /* --- РЕЖИМ ФОНАРИКА WINLINE --- */
        .win-flash-on {
            background: var(--win-orange) !important;
            filter: brightness(2.5) saturate(1.5);
        }

        /* Логотип Winline */
        .logo {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--win-orange);
            letter-spacing: -2px;
            text-transform: uppercase;
            font-style: italic;
            text-shadow: 0 0 40px rgba(255, 106, 19, 0.8);
            line-height: 1;
            transform: skewX(-5deg);
        }
        .logo .dot {
            display: inline-block;
            width: 16px;
            height: 16px;
            background: var(--win-orange);
            border-radius: 50%;
            margin-left: 4px;
            box-shadow: 0 0 20px var(--win-orange);
            vertical-align: super;
        }

        /* Подпись */
        .tagline {
            font-size: 0.9rem;
            color: #888;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: normal;
        }

        /* Конфетти */
        .confetti { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: hidden; }
        .confetti-piece {
            position: absolute; border-radius: 0; animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Стробоскоп оверлей */
        .strobe-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--win-orange);
            opacity: 0;
            z-index: 90;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* Основной экран */
        .main-screen { text-align: center; z-index: 20; padding: 20px; max-width: 90vw; position: relative; }

        h1 {
            font-size: 2.2rem;
            margin: 30px 0 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--win-white);
            text-shadow: 0 0 25px rgba(255, 106, 19, 0.6);
        }
        p.subtitle { font-size: 1.1rem; margin-bottom: 35px; opacity: 0.7; }

        /* Кнопки */
        .btn {
            padding: 18px 50px;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            font-weight: 900;
            border-radius: 50px;
            font-family: inherit;
        }
        .btn-applause {
            background: transparent;
            color: var(--win-white);
            border: 2px solid var(--win-orange);
            box-shadow: 0 0 20px rgba(255, 106, 19, 0.4);
        }
        .btn-applause:active {
            background: var(--win-orange);
            color: var(--win-black);
            transform: scale(0.95);
        }

        .btn-flash {
            margin-top: 18px;
            background: var(--win-orange);
            color: var(--win-black);
            box-shadow: 0 0 50px rgba(255, 106, 19, 0.7);
        }
        .btn-flash:active { transform: scale(0.95); }
        .btn-flash.active {
            background: var(--win-white);
            color: var(--win-black);
            box-shadow: 0 0 80px white;
        }

        .btn-strobe {
            margin-top: 18px;
            background: transparent;
            color: var(--win-orange);
            border: 2px solid var(--win-orange);
        }
        .btn-strobe:active { transform: scale(0.95); }
        .btn-strobe.active {
            background: var(--win-orange);
            color: var(--win-black);
        }

        /* Руки */
        .clap-animation { position: relative; width: 80px; height: 80px; margin: 35px auto; z-index: 10; }
        .hand {
            position: absolute; width: 38px; height: 56px; background: #fff;
            border-radius: 12px 12px 0 0; transform-origin: bottom center;
            animation: clap 0.15s infinite alternate;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .left-hand { left: 2px; transform: rotate(-15deg); }
        .right-hand { right: 2px; transform: rotate(15deg); }
        @keyframes clap {
            0% { transform: rotate(-15deg) translateY(0); }
            100% { transform: rotate(0deg) translateY(-8px); }
        }

        /* Индикатор тряски */
        .shake-indicator {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .shake-indicator.active { color: var(--win-orange); }

        /* Лоадер */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--win-black); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,106,19,0.2);
            border-top: 5px solid var(--win-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Победная линия (фирменный элемент Winline) */
        .win-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--win-orange), transparent);
            opacity: 0;
            z-index: 5;
            animation: win-line-move 2s ease-out;
        }
        @keyframes win-line-move {
            0% { left: -100%; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        @keyframes shake-anim {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, -4px); }
            40% { transform: translate(8px, 4px); }
            60% { transform: translate(-6px, 6px); }
            80% { transform: translate(6px, -6px); }
        }
    </style>
</head>
<body>

    <!-- Конфетти -->
    <div class="confetti" id="confetti"></div>

    <!-- Стробоскоп -->
    <div class="strobe-overlay" id="strobe"></div>

    <!-- Лоадер -->
    <div id="loader">
        <div style="font-size: 1.3rem; margin-bottom: 20px; color: var(--win-orange); font-weight: 900; letter-spacing: 3px;">WINLINE</div>
        <div class="spinner"></div>
    </div>

    <!-- Основной экран -->
    <div class="main-screen">
        <!-- Логотип -->
        <div class="logo">WINLINE<span class="dot"></span></div>
        <div class="tagline">делай разницу</div>

        <h1 id="title">ПОБЕДА!</h1>
        <p class="subtitle">Твой момент триумфа</p>

        <div class="clap-animation">
            <div class="hand left-hand"></div>
            <div class="hand right-hand"></div>
        </div>

        <button class="btn btn-applause" id="play-btn" onclick="startShow()">Аплодировать!</button>
        <br>
        <button class="btn btn-flash" id="light-btn" onclick="toggleWinFlash()" style="display:none;">💡 ФОНАРИК</button>
        <br>
        <button class="btn btn-strobe" id="strobe-btn" onclick="toggleStrobe()" style="display:none;">⚡ СТРОБОСКОП</button>

        <div class="shake-indicator" id="shake-indicator">📱 Потряси телефон для вспышки!</div>
    </div>

    <script>
        // 1. Конфетти в цветах Winline (оранжевый + белый)
        var confettiContainer = document.getElementById('confetti');
        for (var i = 0; i < 200; i++) {
            var piece = document.createElement('div');
            piece.classList.add('confetti-piece');
            piece.style.left = Math.random() * 100 + 'vw';
            piece.style.animationDuration = Math.random() * 3 + 2 + 's';
            piece.style.animationDelay = Math.random() + 's';
            var size = Math.random() * 8 + 4;
            piece.style.width = size + 'px';
            piece.style.height = size + 'px';
            piece.style.background = Math.random() > 0.4 ? '#FF6A13' : '#FFFFFF';
            piece.style.borderRadius = Math.random() > 0.5 ? '0' : '50%';
            confettiContainer.appendChild(piece);
        }

        // 2. Звук аплодисментов (Web Audio API)
        var audioCtx = null;
        var masterGain = null;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.8;
            masterGain.connect(audioCtx.destination);
        }

        function playSound() {
            if (!audioCtx) initAudio();
            else audioCtx.resume();

            // Много коротких хлопков
            for (var i = 0; i < 8; i++) {
                setTimeout(function() {
                    singleClap();
                }, i * 80 + Math.random() * 40);
            }
        }

        function singleClap() {
            var noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
            var data = noiseBuffer.getChannelData(0);
            for (var j = 0; j < data.length; j++) {
                data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / data.length, 2);
            }
            var src = audioCtx.createBufferSource();
            src.buffer = noiseBuffer;

            var filt = audioCtx.createBiquadFilter();
            filt.type = 'bandpass';
            filt.frequency.value = 1500 + Math.random() * 1000;
            filt.Q.value = 2;

            var gain = audioCtx.createGain();
            gain.gain.value = 0.6;

            src.connect(filt);
            filt.connect(gain);
            gain.connect(masterGain);
            src.start(0);
        }

        // 3. ФОНАРИК (максимальная яркость в оранжевом)
        var isFlashOn = false;
        var lightBtn = document.getElementById('light-btn');

        function toggleWinFlash() {
            isFlashOn = !isFlashOn;
            if (isFlashOn) {
                document.body.classList.add('win-flash-on');
                lightBtn.textContent = "ФОНАРИК ВКЛ.";
                lightBtn.classList.add('active');
            } else {
                document.body.classList.remove('win-flash-on');
                lightBtn.textContent = "💡 ФОНАРИК";
                lightBtn.classList.remove('active');
            }
        }

        // 4. СТРОБОСКОП (мигает в цветах Winline)
        var isStrobeOn = false;
        var strobeInterval = null;
        var strobeBtn = document.getElementById('strobe-btn');
        var strobeOverlay = document.getElementById('strobe');

        function toggleStrobe() {
            isStrobeOn = !isStrobeOn;
            if (isStrobeOn) {
                strobeBtn.classList.add('active');
                strobeBtn.textContent = "СТРОБОСКОП ВКЛ.";
                var toggle = false;
                strobeInterval = setInterval(function() {
                    toggle = !toggle;
                    strobeOverlay.style.opacity = toggle ? '0.9' : '0';
                    strobeOverlay.style.background = toggle ? '#FF6A13' : '#FFFFFF';
                }, 100); // Мигает 10 раз в секунду
            } else {
                clearInterval(strobeInterval);
                strobeOverlay.style.opacity = '0';
                strobeBtn.classList.remove('active');
                strobeBtn.textContent = "⚡ СТРОБОСКОП";
            }
        }

        // 5. ТРЯСКА ТЕЛЕФОНА (акселерометр)
        var shakeIndicator = document.getElementById('shake-indicator');
        var lastShakeTime = 0;

        function setupShake() {
            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', function(e) {
                    var acc = e.accelerationIncludingGravity;
                    if (!acc) return;

                    var deltaX = acc.x || 0;
                    var deltaY = acc.y || 0;
                    var deltaZ = acc.z || 0;

                    var totalForce = Math.abs(deltaX) + Math.abs(deltaY) + Math.abs(deltaZ);

                    // Если тряска сильная
                    if (totalForce > 25) {
                        var now = Date.now();
                        if (now - lastShakeTime > 200) {
                            lastShakeTime = now;
                            handleShake();
                        }
                    }
                });
            }
        }

        function handleShake() {
            // Вспышка экрана
            strobeOverlay.style.opacity = '0.95';
            strobeOverlay.style.background = '#FF6A13';
            setTimeout(function() {
                strobeOverlay.style.opacity = '0';
            }, 80);

            // Хлопок
            if (audioCtx) singleClap();

            // Подсветка индикатора
            shakeIndicator.classList.add('active');
            shakeIndicator.textContent = "🔥 ТРЯСКА! ПОБЕДА!";
            setTimeout(function() {
                shakeIndicator.classList.remove('active');
                shakeIndicator.textContent = "📱 Потряси телефон для вспышки!";
            }, 1500);
        }

        // 6. Запуск шоу
        function startShow() {
            document.getElementById('loader').style.display = 'none';

            // Инициализация аудио
            if (!audioCtx) initAudio();
            else audioCtx.resume();

            // Звук аплодисментов
            playSound();

            // Тряска экрана
            document.body.style.animation = 'shake-anim 0.4s';
            setTimeout(function() { document.body.style.animation = ''; }, 400);

            // Победная линия (фирменный элемент Winline)
            var line = document.createElement('div');
            line.className = 'win-line';
            document.body.appendChild(line);
            setTimeout(function() { line.remove(); }, 2000);

            // Показываем кнопки
            lightBtn.style.display = 'inline-block';
            strobeBtn.style.display = 'inline-block';

            // Активируем тряску
            setupShake();

            // Меняем заголовок
            document.getElementById('title').textContent = "УРА! 🎉";
        }

        // Для iOS 13+ нужен запрос разрешения на акселерометр
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            // Запросим при первом касании
            document.addEventListener('touchstart', function() {
                DeviceMotionEvent.requestPermission().then(function(state) {
                    if (state === 'granted') {
                        // ОК
                    }
                }).catch(function() {});
            }, { once: true });
        }
    </script>
</body>
</html>
